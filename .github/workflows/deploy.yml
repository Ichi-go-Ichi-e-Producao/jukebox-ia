name: Deploy Jukeboxia to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check
      - name: Preserve approved music catalog
        run: pnpm exec vitest run client/src/lib/familiaAmizadeTracks.test.ts client/src/lib/familiaAmizadeIdiomasTracks.test.ts --environment node
      - name: Test Lumen operational safeguards
        run: python3 -m unittest discover -s ops/lumen -p 'test_*.py'
      - name: Validate Lumen operational manifest
        run: python3 ops/lumen/check_readiness.py --offline --output /tmp/lumen-readiness.md
      - name: Build
        run: pnpm build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "jukeboxia"
          VITE_APP_TITLE: "Jukeboxia"
      - name: Copy static pages
        run: |
          cp privacy.html dist/public/privacy.html
          cp foco-bem-estar-privacidade.html dist/public/foco-bem-estar-privacidade.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/public'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
