name: Jukeboxia security checks (read-only)

on:
  push:
    branches: [fix/security-aikido-20261118]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: '10.4.1'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check
      - name: Test approved music catalog and security safeguards
        run: pnpm test
      - name: Test Lumen operational safeguards
        run: python3 -m unittest discover -s ops/lumen -p 'test_*.py'
      - name: Validate Lumen operational manifest offline
        run: python3 ops/lumen/check_readiness.py --offline --output /tmp/lumen-readiness.md
      - name: Build
        run: pnpm build
        env:
          VITE_ANALYTICS_ENDPOINT: ""
          VITE_ANALYTICS_WEBSITE_ID: ""
          VITE_APP_ID: "jukeboxia"
          VITE_APP_TITLE: "Jukeboxia"
